<h2 class="text-center">Sales</h2>
<table class="table table-striped">
  <tbody>
    <tr>
      <th>Sales Name</th>
      <th>Job Percentage</th>
      <th>Actions</th>
    </tr>

    {% for sd in sales_details_for_job %}
    <tr>
      <td>{{ sd.sales_name }}</td>
      <td>{{ '%.2f'|format(sd.job_percentage|float) }}%</td>
      <td></td>
    </tr>
    {% endfor %}

  <tr>
    <td>
      <select name="sales_add" class="form-select">
        <option value="" disabled selected>Select sales</option>
        {% for s in sales_list %}
        <option value="{{ s.sales_id }}">{{ s.sales_name }}</option>
        {% endfor %}
      </select>
    </td>
    <td>
      <input class="form-control" type="text" name="job_percentage_add" id="job_percentage_add">
    </td>
    <td>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="_add_sales" id="add_sales_on_save" value="1">
        <label class="form-check-label" for="add_sales_on_save">Add on save</label>
      </div>
    </td>
  </tr>
  </tbody>
</table>
