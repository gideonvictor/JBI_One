<h2 class="d-flex justify-content-center align-items-center gap-3 my-3">Start Up</h2>
<table class="table table-striped">
  <tbody>
    <tr>
      <th>Sales Name</th>
      <th>Start Up</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>

    {% for su in start_ups_for_job %}
    <tr>
      <td>{{ su[1] or 'Unknown' }}</td>
      <td>
        <input class="form-control" type="text" name="job_start_up_{{ su[0].auto_id }}" value="{{ '%.2f'|format(su[0].job_start_up|float) if su[0].job_start_up else '' }}" inputmode="decimal" pattern="(?:(?:\d{1,3}(?:,\d{3})+)|\d+)(?:\.\d+)?" title="Enter a number like 100, 1,000 or 100.87">
      </td>
      <td>
        <input class="form-control" type="date" name="job_start_up_date_{{ su[0].auto_id }}" value="{{ su[0].job_start_up_date or '' }}">
      </td>
      <td>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="delete_start_up_{{ su[0].auto_id }}" id="delete_start_up_{{ su[0].auto_id }}" value="1">
          <label class="form-check-label" for="delete_start_up_{{ su[0].auto_id }}">Delete</label>
        </div>
      </td>
    </tr>
    {% endfor %}

  <tr>
    <td>
      <select name="start_up_sales_add" class="form-select">
        <option value="" disabled selected>Select sales</option>
        {% for s in sales_list %}
        <option value="{{ s.sales_id }}">{{ s.sales_name }}</option>
        {% endfor %}
      </select>
    </td>
    <td>
      <input class="form-control" type="text" name="job_start_up_add" id="job_start_up_add" inputmode="decimal" pattern="(?:(?:\d{1,3}(?:,\d{3})+)|\d+)(?:\.\d+)?" title="Enter a number like 100, 1,000 or 100.87">
    </td>
    <td>
      <input class="form-control" type="date" name="job_start_up_date_add" id="job_start_up_date_add">
    </td>
    <td>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="_add_start_up" id="add_start_up_on_save" value="1">
        <label class="form-check-label" for="add_start_up_on_save">Add on save</label>
      </div>
    </td>
  </tr>
  </tbody>
</table>
