<h2 class="text-center">Engineer</h2>
    <table class="table table-striped">
    <tbody>
    <tr>
        <th>Engineer Name</th>
        <th>Actions</th>
    </tr>
    {% for en in eng %}
        <tr>
            <td>{{ en.engineer_name }}</td>
            <td>
            </td>
        </tr>
    {% endfor %}
    <tr>
    <td>
      <select name="engineer_add" class="form-select">
        <option value="" disabled selected>Select engineer</option>
        {% for e in engineers_list %}
        <option value="{{ e.engineer_id }}">{{ e.engineer_name }}</option>
        {% endfor %}
      </select>
    </td>
    <td>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="_add_engineer" id="add_engineer_on_save" value="1">
        <label class="form-check-label" for="add_engineer_on_save">Add on save</label>
      </div>
    </td>
  </tr>
    </tbody>
    </table>
