<h2 class="d-flex justify-content-center align-items-center gap-3 my-3">Start Up</h2>
<table class="table table-striped">
  <tbody>
    <tr>
      <th>Sales Name</th>
      <th>Start Up</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>

    {% for su in start_ups_for_job %}
    <tr>
      <td>{{ su[1] or 'Unknown' }}</td>
      <td>$ {{ '%.2f'|format(su[0].job_start_up|float) }}</td>
      <td>{{ su[0].job_start_up_date }}</td>
      <td>
        <form
          action="{{ url_for('job_start_up_delete', auto_id=su[0].auto_id) }}"
          method="POST"
          style="display:inline;"
        >
          <button
            class="btn btn-outline-danger btn-sm"
            type="submit"
            onclick="return confirm('Are you sure you want to delete this start up record?');"
          >
            Delete
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}

    <form action="/detail/{{ job_detail.job_id }}/edit_start_up" method="POST">
      <tr>
        <td>
          <select name="sales_name" class="form-select" required>
            <option value="" disabled selected>Select sales</option>
            {% for s in sales_list %}
            <option value="{{ s.sales_name }}">{{ s.sales_name }}</option>
            {% endfor %}
          </select>
        </td>
        <td>
          <input class="form-control" type="text" name="job_start_up" id="job_start_up" inputmode="decimal" pattern="(?:(?:\d{1,3}(?:,\d{3})+)|\d+)(?:\.\d+)?" title="Enter a number like 100, 1,000 or 100.87" required>
        </td>
        <td>
          <input class="form-control" type="date" name="job_start_up_date" id="job_start_up_date">
        </td>
        <td>
          <button class="btn btn-outline-primary" type="submit">Add</button>
        </td>
      </tr>
    </form>
  </tbody>
</table>
